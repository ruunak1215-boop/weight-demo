<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>重さ知覚デモ D・E｜解放感</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#152230;font-size:15px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{position:fixed;inset:0;background:#fff}#visual{position:fixed;inset:0;background:#fff;will-change:background-color}#controls{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 64px);overflow:auto;max-width:520px;margin:0 auto;background:rgba(255,255,255,.95);border:1px solid #d8e2e8;box-shadow:0 12px 30px #0002;border-radius:20px;padding:18px;transition:opacity .12s}body.testing #controls{opacity:0;pointer-events:none}h1{font-size:20px;margin:0 0 6px}p{margin:0 0 12px;color:#4d5a68;font-size:13px;line-height:1.5}label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:13px 0 5px}input[type=range]{width:100%;accent-color:#137e82}button{border:1px solid #c8d5db;border-radius:11px;background:#f7fafb;color:#162a33;padding:11px 13px;font-size:14px;font-weight:700}button.sel,button.primary{background:#087e85;color:white;border-color:#087e85}button:active{transform:scale(.98)}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.buttons button{flex:1;min-width:92px}#bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 10px);left:10px;right:10px;display:flex;justify-content:center;gap:8px;z-index:20}#bottom button{background:#eef5f6e8;box-shadow:0 4px 18px #0002;min-width:110px}#bottom button.primary{background:#087e85}.small{color:#506272;font-size:12px}.values{display:flex;gap:8px;margin:10px 0}.value{flex:1;background:#edf5f5;border-radius:12px;padding:9px;text-align:center}.value strong{display:block;font-size:21px}svg{width:100%;height:auto;display:block;background:#f6f9fa;border:1px solid #dee7e9;border-radius:11px}.note{background:#f0f6f7;border-radius:11px;padding:10px;font-size:12px;line-height:1.6;color:#364951}#sensorState{font-weight:700}#visual{transition:none!important}button{touch-action:manipulation}@media(max-height:720px){#controls{padding:13px}label{margin-top:8px}}
</style></head><body><div id="visual"></div><main id="controls"><h1>デモ D・E｜持ち上げ途中の解放感</h1><p>スマホを机から弧を描いて持ち上げ、顔の方向へ回転させる動作を想定。画面全体の明るさが変わります。</p>
<div class="buttons"><button id="d" class="sel">D：途中で急変</button><button id="e">E：暗く→明るく</button></div><div id="description" class="note"></div>
<div class="buttons"><button id="sensor" class="primary">センサーを開始／再基準化</button><button id="manual">手動で試す</button><button id="reset">開始位置に戻す</button></div>
<p id="sensorState">状態：手動モード</p><div class="values"><div class="value">動作進行度<strong id="progressText">0%</strong></div><div class="value">暗さ<strong id="darknessText">0%</strong></div></div>
<label for="manualProgress">手動で持ち上げを再現 <span id="manualProgressText">0%</span></label><input id="manualProgress" type="range" min="0" max="100" step="1" value="0">
<label for="threshold">解放する地点 <span id="thresholdText">50%</span></label><input id="threshold" type="range" min="15" max="85" value="50">
<label for="width">変化の急激さ <span id="widthText">12%</span></label><input id="width" type="range" min="2" max="50" value="12"><p class="small">小さいほど急変。Dは暗くなる速さ、Eは明るく戻る速さ。</p>
<div id="eSettings"><label for="peak">E：折り返し時の暗さ <span id="peakText">95%</span></label><input id="peak" type="range" min="30" max="100" value="95"><label for="startDark">E：序盤の暗くなる速さ <span id="startDarkText">1.0×</span></label><input id="startDark" type="range" min="50" max="250" value="100"><p class="small">Eは最初に白→黒に近づき、解放地点で黒→白へ戻ります。</p></div>
<label for="angle">変化完了の傾き量 <span id="angleText">45°</span></label><input id="angle" type="range" min="15" max="90" value="45"><p class="small">センサーはスマホの傾きの変化を進行度として使用。高さや腕の軌道自体は測定しません。</p>
<label>表示カーブ（横＝動作進行、縦＝暗さ）</label><svg viewBox="0 0 340 155" role="img" aria-label="持ち上げ進行度と画面の暗さのグラフ"><path d="M30 10V125H330" stroke="#9aaab1" fill="none"/><path d="M30 65H330M180 10V125" stroke="#d8e2e5" stroke-dasharray="3 4"/><text x="6" y="14" font-size="9" fill="#4c6069">黒</text><text x="6" y="125" font-size="9" fill="#4c6069">白</text><text x="284" y="143" font-size="9" fill="#4c6069">進行度→</text><polyline id="curve" fill="none" stroke="#087e85" stroke-width="3" stroke-linejoin="round"/><line id="cursor" y1="10" y2="125" stroke="#f97316" stroke-width="2"/><circle id="current" r="4.5" fill="#f97316"/></svg>
<div class="note" style="margin-top:10px">画面上の「全画面テスト」で設定パネルを隠せます。ホーム画面から開くとiPhone Safariのバーも減らせます。動きと色の反応に余計なアニメーション遅延は加えていません。</div></main>
<div id="bottom"><button id="test" class="primary">全画面テスト</button><button id="show">設定を表示</button></div>
<script>
const $=id=>document.getElementById(id);let mode='D',sensorOn=false,base=null,progress=0,lastAngle=null;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function params(){return{threshold:+$('threshold').value,width:+$('width').value,peak:+$('peak').value,start:+$('startDark').value/100,angle:+$('angle').value}};
function darkness(p){const c=params();const t=c.threshold,w=c.width;if(mode==='D'){return 100*ease((p-(t-w/2))/w)}
// E: the screen first darkens continuously, then rapidly becomes light.
const onset=clamp(t-w/2,5,90);const phase=clamp(p/onset,0,1);const first=c.peak*(1-Math.pow(1-phase,c.start));if(p<=onset)return first;return c.peak*(1-ease((p-onset)/w));}
function update(){let d=clamp(darkness(progress),0,100);let v=Math.round(255*(1-d/100));$('visual').style.backgroundColor=`rgb(${v},${v},${v})`;document.body.style.backgroundColor=`rgb(${v},${v},${v})`;$('progressText').textContent=Math.round(progress)+'%';$('darknessText').textContent=Math.round(d)+'%';$('manualProgress').value=Math.round(progress);$('manualProgressText').textContent=Math.round(progress)+'%';let pts=[];for(let i=0;i<=100;i++){pts.push(`${(30+3*i).toFixed(1)},${(125-1.15*darkness(i)).toFixed(1)}`)}$('curve').setAttribute('points',pts.join(' '));let x=30+3*progress,y=125-1.15*d;$('cursor').setAttribute('x1',x);$('cursor').setAttribute('x2',x);$('current').setAttribute('cx',x);$('current').setAttribute('cy',y)}
function sync(){for(const k of ['threshold','width','peak','angle'])$(k+'Text').textContent=$(k).value+(k==='angle'?'°':'%');$('startDarkText').textContent=(+$('startDark').value/100).toFixed(1)+'×';$('eSettings').style.display=mode==='E'?'block':'none';$('d').classList.toggle('sel',mode==='D');$('e').classList.toggle('sel',mode==='E');$('description').textContent=mode==='D'?'D：最初は白いまま。持ち上げ途中の指定地点で画面全体が一気に白→黒へ変化。抵抗が「切り替わる」感覚を探る。':'E：持ち上げ始めは白→黒へ徐々に暗くなり、途中の指定地点で急速に黒→白へ反転。解放・浮遊感を探る。';update()}
function reset(){progress=0;base=null;lastAngle=null;update()}
$('d').onclick=()=>{mode='D';reset();sync()};$('e').onclick=()=>{mode='E';reset();sync()};for(const k of ['threshold','width','peak','startDark','angle'])$(k).addEventListener('input',sync);
$('manualProgress').oninput=e=>{sensorOn=false;$('sensorState').textContent='状態：手動モード';progress=+e.target.value;update()};$('manual').onclick=()=>{sensorOn=false;$('sensorState').textContent='状態：手動モード'};$('reset').onclick=reset;
let seenOrientation=false;window.addEventListener('deviceorientation',e=>{if(!sensorOn||typeof e.beta!=='number')return;seenOrientation=true;let beta=e.beta;if(base===null)base=beta;lastAngle=beta;let delta=Math.abs(beta-base);progress=clamp(100*delta/params().angle,0,100);$('sensorState').textContent='状態：センサー連動（基準 '+base.toFixed(1)+'° / 現在 '+beta.toFixed(1)+'°）';update()},{passive:true});
$('sensor').onclick=async()=>{try{if(typeof DeviceOrientationEvent==='undefined')throw Error('このブラウザは姿勢センサーに対応していません');if(typeof DeviceOrientationEvent.requestPermission==='function'){let permission=await DeviceOrientationEvent.requestPermission();if(permission!=='granted')throw Error('センサー使用が許可されていません')}base=null;lastAngle=null;progress=0;sensorOn=true;seenOrientation=false;update();$('sensorState').textContent='状態：センサーの値を待っています（机上に置いて開始）';setTimeout(()=>{if(sensorOn&&!seenOrientation)$('sensorState').textContent='センサー値を取得できません。SafariでHTTPS公開URLを開き、許可を確認してください。'},1600)}catch(e){sensorOn=false;$('sensorState').textContent='センサー開始失敗：'+e.message}};
$('test').onclick=()=>{document.body.classList.add('testing')};$('show').onclick=()=>{document.body.classList.remove('testing')};
sync();
</script></body></html>
